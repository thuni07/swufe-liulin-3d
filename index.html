<body>
<div id="scene"></div>
<header class="topbar"><div class="eyebrow">SWUFE · LIULIN CAMPUS / CAMPUS ATLAS</div><h1>西财柳林 · 漫游地图</h1><div class="sub">把校园装进一幅日系动画场景里。拖动旋转 · 滚轮缩放 · 点击建筑查看</div></header>
<aside class="panel"><h2>⌕　寻找校园地点</h2><input id="search" class="search" placeholder="搜索：格致楼、食堂、宿舍…"><div class="chips" id="chips"><button class="chip active" data-cat="全部">全部</button><button class="chip" data-cat="教学">教学</button><button class="chip" data-cat="生活">生活</button><button class="chip" data-cat="运动">运动</button><button class="chip" data-cat="校门">校门</button></div><div id="places"></div><div class="footer">地图为基于公开资料构建的概念性3D示意模型。建筑位置、尺寸与道路细节尚未经过测绘校准。</div></aside>
<section class="detail" id="detail"><div class="tag">CAMPUS SPOTLIGHT</div><h2>欢迎来到柳林校区</h2><p>选择右侧地点，或直接点击场景中的建筑。你可以自由旋转、缩放，从不同角度探索这座校园。</p></section>
<div class="north">N　<b>↑</b>　校园示意北向</div><div class="hint">鼠标拖动：旋转　·　滚轮：缩放　·　右键拖动：平移</div><div class="controls"><button id="home">⌂ 重置视角</button><button id="top">▦ 鸟瞰视角</button><button id="labels">◎ 标签开关</button></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);controls.maxPolarAngle=Math.PI*.49;controls.minDistance=18;controls.maxDistance=125;
scene.add(new THREE.HemisphereLight('#fff4dc','#648b80',2));const sun=new THREE.DirectionalLight('#fff0c7',3.2);sun.position.set(-35,60,28);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,rough=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});const grass=mat('#a9c99b'),grass2=mat('#bdd5a6'),road=mat('#b7c3b4'),path=mat('#e9dfc5'),wall=mat('#f3e8d3'),white=mat('#fff8e8'),roof=mat('#638b86'),roof2=mat('#d58d7c'),windowM=mat('#86b8b3',.45),dark=mat('#365b57'),water=mat('#8fc9c5',.35),pink=mat('#f1b2a7');
const ground=new THREE.Mesh(new THREE.BoxGeometry(112,.8,94),grass);ground.position.y=-.5;ground.receiveShadow=true;scene.add(ground);
function box(parent,w,h,d,material,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
// perimeter roads and pedestrian paths
box(scene,112,.12,3,road,0,-.02,-43);box(scene,112,.12,3,road,0,-.02,43);box(scene,3,.12,86,road,-52,-.02,0);box(scene,3,.12,86,road,52,-.02,0);
box(scene,70,.1,2.2,path,0,.02,0);box(scene,2.2,.1,70,path,0,.02,0);box(scene,46,.1,1.5,path,-5,.03,-18);box(scene,1.5,.1,48,path,24,.03,4);
// tree geometry
const trunk=mat('#8b6b4e'),leaf=mat('#5c9a78'),leaf2=mat('#82b58a');function tree(x,z,s=1){const g=new THREE.Group();box(g,.22*s,1.25*s,.22*s,trunk,0,0,0);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(.78*s,1),Math.random()>.5?leaf:leaf2);crown.position.set(0,1.55*s,0);crown.castShadow=true;g.add(crown);g.position.set(x,0,z);scene.add(g)}
for(let z=-38;z<=38;z+=5){tree(-47,z,.8+Math.random()*.4);tree(47,z,.8+Math.random()*.4)}for(let x=-43;x<=43;x+=5){tree(x,-38,.8+Math.random()*.5);tree(x,38,.8+Math.random()*.5)}for(let i=0;i<54;i++){let x=(Math.random()-.5)*82,z=(Math.random()-.5)*65;if(Math.abs(x)<5||Math.abs(z)<4)continue;tree(x,z,.55+Math.random()*.55)}
// ponds, fields
const pond=new THREE.Mesh(new THREE.BoxGeometry(10,.18,6),water);pond.position.set(-27,.06,17);pond.receiveShadow=true;scene.add(pond);for(let i=0;i<4;i++){const ripple=new THREE.Mesh(new THREE.BoxGeometry(1.8,.025,.08),white);ripple.position.set(-29+i*1.6,.17,17+(i%2));scene.add(ripple)}
const field=box(scene,17,.18,11,mat('#5b9e75'),26,.02,-26);const inner=box(scene,12,.05,6,mat('#a7c985'),26,.23,-26);for(let x=20;x<=32;x+=3)box(scene,.08,.06,6,white,x,.28,-26);
const data=[
{name:'格致楼',cat:'教学',x:-19,z:-20,w:10,d:7,h:8,color:'roof',desc:'教学与学习空间。这里以浅色墙面、青绿色屋顶和整齐窗格表现日系校园建筑感。'},
{name:'经世楼',cat:'教学',x:-4,z:-25,w:12,d:8,h:10,color:'roof2',desc:'校园教学建筑地标之一。模型采用较高的主体体量与入口门廊作为识别元素。'},
{name:'通博楼 / 教学区',cat:'教学',x:10,z:-18,w:9,d:7,h:7,color:'roof',desc:'教学区示意建筑。具体楼栋轮廓与落位仍需根据最新官方地图校准。'},
{name:'图书馆 / 学习中心',cat:'教学',x:2,z:-4,w:12,d:9,h:9,color:'roof2',desc:'校园公共学习空间的概念化表达，设有中央入口、窗格和屋顶层次。'},
{name:'学生公寓区',cat:'生活',x:-30,z:2,w:8,d:6,h:12,color:'roof',desc:'宿舍区以重复的窗格和阳台节奏表达。实际宿舍楼栋较多，此处为区域级模型。'},
{name:'学生公寓区·东',cat:'生活',x:-19,z:7,w:8,d:6,h:11,color:'roof2',desc:'学生生活区示意。可用右侧搜索快速定位生活设施。'},
{name:'一粟堂',cat:'生活',x:19,z:8,w:8,d:6,h:5,color:'roof2',desc:'校园餐饮设施之一。模型以较低的公共建筑体量表示。'},
{name:'三味堂',cat:'生活',x:29,z:10,w:8,d:6,h:5,color:'roof',desc:'校园食堂区域示意，具体入口、楼层与内部设施未建模。'},
{name:'五谷堂',cat:'生活',x:34,z:20,w:7,d:6,h:5,color:'roof2',desc:'校园餐饮设施之一，建筑外形为示意模型。'},
{name:'体育场',cat:'运动',x:26,z:-26,w:17,d:11,h:1,color:'roof2',desc:'运动场区域，绿色场地用于帮助辨认校园运动设施所在的大致区域。'},
{name:'游泳池',cat:'运动',x:36,z:-10,w:10,d:5,h:1,color:'water',desc:'游泳设施示意。水面以蓝绿色材质表现。'},
{name:'校医院',cat:'生活',x:-35,z:-13,w:7,d:5,h:4,color:'roof',desc:'校园医疗服务点示意位置，实际位置需进一步对照最新校园地图。'},
{name:'学生活动中心',cat:'生活',x:12,z:17,w:9,d:7,h:6,color:'roof2',desc:'学生社团与校园活动空间的示意建筑。'},
{name:'南门',cat:'校门',x:0,z:43,w:12,d:2,h:3,color:'roof2',desc:'校园南侧出入口示意。入校规定与开放情况请以学校通知为准。'},
{name:'北门',cat:'校门',x:0,z:-43,w:12,d:2,h:3,color:'roof',desc:'校园北侧出入口示意。'}
];
const objects=[];const labelSprites=[];function label(text,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#fff9e8';ctx.strokeStyle='#234d4a';ctx.lineWidth=8;roundRect(ctx,10,10,492,108,25);ctx.fill();ctx.stroke();ctx.fillStyle='#234d4a';ctx.font='bold 44px "Microsoft YaHei", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,65);const tex=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));s.position.set(x,y,z);s.scale.set(8,2,1);s.userData.isLabel=true;scene.add(s);labelSprites.push(s);return s}function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const roofM={roof,roof2};data.forEach((d,i)=>{const g=new THREE.Group();g.position.set(d.x,0,d.z);const wm=wall;box(g,d.w,d.h,d.d,wm,0,0,0);box(g,d.w+.5,.45,d.d+.5,roofM[d.color]||roof,0,d.h,0);if(d.h>3){box(g,d.w*.36,.8,.25,dark,0,1.2,d.d/2+.14);for(let yy=2;yy<d.h-.2;yy+=1.7){for(let xx=-d.w/2+1;xx<d.w/2-.2;xx+=1.5){box(g,.65,.75,.09,windowM,xx,yy,d.d/2+.07);box(g,.65,.75,.09,windowM,xx,yy,-d.d/2-.07)}}for(let zz=-d.d/2+1;zz<d.d/2;zz+=1.5){for(let xx=-d.w/2+.6;xx<d.w/2;xx+=1.8)box(g,.55,.7,.08,windowM,xx,2,zz)}}const plaque=box(g,d.w*.45,.45,.15,white,0,1.6,d.d/2+.15);plaque.userData.building=d;g.traverse(o=>{if(o.isMesh)o.userData.building=d});scene.add(g);objects.push(g);label(d.name,d.x,d.h+3,d.z);});
// campus entrance signs
function gate(x,z,txt){box(scene,1,4,1,roof2,x-4,0,z);box(scene,1,4,1,roof2,x+4,0,z);box(scene,10,.8,1,white,x,3.5,z);label(txt,x,6,z)}gate(0,42,'西财 · 南门');gate(0,-42,'西财 · 北门');
// dotted walking routes
const pts=[new THREE.Vector3(0,.16,38),new THREE.Vector3(0,.16,20),new THREE.Vector3(0,.16,0),new THREE.Vector3(0,.16,-15),new THREE.Vector3(0,.16,-34)];const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:'#e18e7f',dashSize:1.3,gapSize:.65,linewidth:2}));line.computeLineDistances();scene.add(line);
// list/search and interactions
let activeCat='全部',labelsOn=true;const places=document.querySelector('#places'),search=document.querySelector('#search'),detail=document.querySelector('#detail');function selectSpot(d){detail.innerHTML=`<div class="tag">CAMPUS SPOTLIGHT / ${d.cat}</div><h2>${d.name}</h2><p>${d.desc}</p><p style="font-size:10px;color:#9a7d68">位置为概念模型中的相对位置，并非导航级坐标。</p>`;controls.target.set(d.x,1,d.z);}
function renderList(){places.innerHTML='';const q=search.value.trim().toLowerCase();data.filter(d=>(activeCat==='全部'||d.cat===activeCat)&&(!q||d.name.toLowerCase().includes(q)||d.cat.includes(q))).forEach(d=>{const el=document.createElement('div');el.className='place';el.innerHTML=`<strong>${d.name}</strong><small>${d.cat}　·　点击飞行定位</small>`;el.onclick=()=>{selectSpot(d);camera.position.set(d.x+17, d.h+15,d.z+20)};places.appendChild(el)})}renderList();search.addEventListener('input',renderList);document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.cat;renderList()}));
document.querySelector('#home').onclick=()=>{camera.position.set(48,48,58);controls.target.set(0,0,0)};document.querySelector('#top').onclick=()=>{camera.position.set(0,105,.1);controls.target.set(0,0,0)};document.querySelector('#labels').onclick=()=>{labelsOn=!labelsOn;labelSprites.forEach(s=>s.visible=labelsOn)};
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.panel,.topbar,.detail,.controls'))return;const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(scene.children,true);for(const h of hits){let o=h.object;while(o&&!o.userData.building)o=o.parent;if(o&&o.userData.building){selectSpot(o.userData.building);break}}});

</script>
